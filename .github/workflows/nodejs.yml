name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
      - name: Install Deps
        run: pnpm i
      - name: Check formatting
        run: npm run format:check
      - name: Install Playwright
        run: npx playwright install --with-deps && npx playwright install-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Run Preact 10 e2e tests
        run: npm run build:chrome && npm run test:e2e -- --retries=5
        env:
          PREACT_VERSION: 10
          CI: true
      - name: Run Preact 11 e2e tests
        run: npm run test:e2e -- --retries=5
        env:
          PREACT_VERSION: 11
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
